name: Publish prebuilt language packs

# Sign and publish pack directories uploaded manually or built elsewhere.
# Prefer build-sign-publish.yml for the full build → sign → release pipeline.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. l10n-v1)'
        required: true
        default: 'l10n-v1'
      signing_key_id:
        description: 'Signing key id (empty to skip signing)'
        required: false
        default: 'l10n-k1'
      artifact_dir:
        description: 'Directory with languages.json and *.scomm-langpack folders or zips'
        required: true
        default: 'dist'

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'scomm-public/localizations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare pack root
        run: |
          set -euo pipefail
          DIR="${{ inputs.artifact_dir }}"
          if [ ! -f "$DIR/languages.json" ]; then
            echo "Missing $DIR/languages.json"
            exit 1
          fi
          if compgen -G "$DIR/*.scomm-langpack" > /dev/null; then
            echo "Found unpacked pack directories"
          elif compgen -G "$DIR/*.scomm-langpack.zip" > /dev/null; then
            echo "Found zip assets (signing skipped unless unpacked dirs present)"
          else
            echo "No pack assets under $DIR"
            exit 1
          fi

      - name: Sign unpacked manifests
        if: inputs.signing_key_id != ''
        env:
          L10N_SIGNING_KEY_ID: ${{ inputs.signing_key_id }}
          L10N_SIGNING_PRIVATE_KEY_L10N_K1: ${{ secrets.L10N_SIGNING_PRIVATE_KEY_L10N_K1 }}
        run: |
          set -euo pipefail
          DIR="${{ inputs.artifact_dir }}"
          if compgen -G "$DIR/*.scomm-langpack" > /dev/null; then
            chmod +x tools/sign_language_packs.sh tools/package_language_packs.sh
            ./tools/sign_language_packs.sh "$DIR"
            ./tools/package_language_packs.sh "$DIR" "${{ inputs.tag }}" scomm-public/localizations
          else
            echo "No unpacked directories; publishing zips as-is"
          fi

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ inputs.artifact_dir }}/languages.json
            ${{ inputs.artifact_dir }}/*.scomm-langpack.zip
